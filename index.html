<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#276647">
  <meta name="description" content="Atividades de leitura para crianças. Funciona sem internet depois de salvar o arquivo.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hora de Ler">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Comic+Neue:wght@700&family=Dancing+Script:wght@600;700&family=Indie+Flower&family=Patrick+Hand&display=swap" rel="stylesheet">
  <title>Hora de Ler</title>
  <style>
    :root {
      --bg: #f8f8f2; --surface: #ffffff; --ink: #22313a; --muted: #61717c;
      --blue: #285f82; --blue-dark: #194662; --pale: #eaf3f8;
      --line: #dee6e9; --green: #237a53; --green-pale: #e8f6ee;
      --red: #ac4947; --red-pale: #fff0ee;
      --shadow: 0 16px 38px rgba(33, 55, 64, .075);
      --reading-size: 32px;
      --reading-font: Verdana, Arial, sans-serif;
      --reading-case: none;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; font-family: Verdana, Arial, sans-serif; background: var(--bg); color: var(--ink); }
    button, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #db9747; outline-offset: 3px; }
    .wrap { width: min(930px, calc(100% - 38px)); margin: auto; }
    .topbar { background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
    .topbar-inner { min-height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 13px; text-align: left; border: 0; background: transparent; padding: 0; color: inherit; }
    .brand-icon { display: grid; place-items: center; background: #e6f1eb; color: #276647; border-radius: 16px; width: 47px; height: 47px; font-weight: 900; font-size: 22px; }
    .brand strong { display: block; font-size: 20px; letter-spacing: -.7px; }
    .brand small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .mini-btn { background: transparent; color: var(--blue); border: 1px solid var(--line); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; }
    main { padding: 29px 0 70px; }
    .eyebrow { color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
    h1 { font-size: clamp(26px, 4.3vw, 39px); line-height: 1.15; letter-spacing: -1.3px; margin: 9px 0 12px; }
    .intro { font-size: 16px; line-height: 1.65; color: var(--muted); max-width: 680px; margin: 0 0 8px; }
    .group-title { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin: 26px 0 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
    .lesson { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 20px; min-height: 168px; transition: border-color .15s, transform .15s; display: flex; flex-direction: column; align-items: flex-start; width: 100%; }
    .lesson:hover { border-color: #8bb3c6; transform: translateY(-2px); }
    .lesson-art { width: 58px; height: 58px; border-radius: 15px; display: grid; place-items: center; font-size: 28px; background: #ecf5f1; margin-bottom: 16px; font-weight: 900; color: #276647; }
    .lesson-art.letters { font-size: 20px; letter-spacing: -.4px; }
    .lesson-name { font-size: 19px; font-weight: 800; line-height: 1.35; }
    .lesson-meta { color: var(--muted); font-size: 13px; margin-top: 7px; line-height: 1.45; }
    .lesson-score { color: var(--green); font-weight: 700; font-size: 13px; margin-top: auto; padding-top: 13px; }
    .lesson-score.waiting { color: var(--muted); font-weight: 650; }
    .note { margin-top: 22px; padding: 16px 18px; background: #f1f2ea; border-radius: 14px; font-size: 14px; color: #55636b; line-height: 1.6; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: clamp(20px, 4.5vw, 42px); }
    .stage-head { display: flex; gap: 14px; justify-content: space-between; align-items: center; margin-bottom: 19px; }
    .stage-title { font-size: clamp(25px, 4.4vw, 34px); letter-spacing: -.8px; margin: 8px 0 12px; }
    .story-lines { display: flex; flex-direction: column; gap: 14px; margin: 24px 0 31px; }
    .story-line { display: flex; align-items: baseline; gap: 15px; border: 1px solid #e7ecec; border-radius: 15px; padding: 15px 18px; background: #fcfdfa; line-height: 1.45; }
    .story-line .line-num { flex: 0 0 26px; color: #9aa9ac; font-size: 14px; font-weight: 700; text-align: center; }
    .story-line .line-text { font-size: var(--reading-size); font-family: var(--reading-font); font-weight: 650; letter-spacing: .2px; overflow-wrap: anywhere; text-transform: var(--reading-case); }
    .read-tools, .sizes, .type-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .read-tools { justify-content: space-between; }
    .sizes, .type-tools { color: var(--muted); font-size: 13px; font-weight: 700; }
    .size-btn, .tool, .case-btn { display: grid; place-items: center; min-width: 45px; height: 45px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-weight: 800; color: var(--blue); padding: 0 12px; }
    .size-btn:disabled, .tool:disabled { opacity: .4; cursor: default; }
    .tool.on, .case-btn.on { background: var(--pale); border-color: #2779a5; }
    .font-select { height: 45px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--blue); font-weight: 800; font-size: 14px; padding: 0 12px; max-width: min(100%, 220px); }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 11px; margin-top: 25px; }
    .primary { border: 0; background: var(--blue); color: white; padding: 17px 23px; border-radius: 15px; font-size: 17px; font-weight: 800; min-height: 56px; }
    .primary:hover { background: var(--blue-dark); }
    .primary:disabled { background: #9cb2bf; cursor: not-allowed; }
    .secondary { border: 1px solid #cddbe1; color: var(--blue-dark); background: #fff; padding: 16px 21px; border-radius: 15px; min-height: 56px; font-weight: 800; font-size: 15px; }
    .helper { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .quiz-progress { display: flex; align-items: center; gap: 14px; margin: 0 0 23px; }
    .progress-track { background: #e5edef; border-radius: 999px; overflow: hidden; height: 9px; flex: 1; }
    .progress-track span { background: #64a4b4; height: 100%; display: block; }
    .progress-label { color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .question { font-weight: 800; font-size: var(--reading-size); font-family: var(--reading-font); line-height: 1.45; letter-spacing: -.3px; margin: 10px 0 22px; overflow-wrap: anywhere; text-transform: var(--reading-case); }
    .answers { display: grid; gap: 12px; }
    .answer { text-align: left; display: flex; align-items: center; gap: 14px; min-height: 74px; border-radius: 18px; border: 2px solid #cfdbdf; background: #fff; color: var(--ink); font-size: clamp(18px, 2.6vw, 24px); font-family: var(--reading-font); font-weight: 800; padding: 14px 16px; line-height: 1.3; text-transform: var(--reading-case); }
    .answer:hover { border-color: #70a2bd; }
    .mark { width: 36px; height: 36px; flex: 0 0 36px; border: 2px solid #9aafb8; border-radius: 8px; display: grid; place-items: center; font-size: 20px; }
    .answer.selected { border-color: #2779a5; background: var(--pale); }
    .answer.selected .mark { background: var(--blue); color: #fff; border-color: var(--blue); }
    .answer.right { border-color: var(--green); background: var(--green-pale); }
    .answer.wrong { border-color: var(--red); background: var(--red-pale); }
    .answer.locked { cursor: default; }
    .answer.locked:hover { border-color: #cfdbdf; }
    .answer.locked.selected:hover { border-color: #2779a5; }
    .answer.locked.right:hover { border-color: var(--green); }
    .answer.locked.wrong:hover { border-color: var(--red); }
    .text-toggle { border: 0; background: #edf4f6; border-radius: 12px; padding: 12px 16px; color: var(--blue); font-weight: 800; font-size: 14px; }
    .reference { margin: 0 0 18px; padding: 17px 20px; background: #f7f9f6; border: 1px solid var(--line); border-radius: 14px; }
    .reference p { font-size: calc(var(--reading-size) * .72); font-family: var(--reading-font); line-height: 1.45; font-weight: 700; margin: 10px 0; text-transform: var(--reading-case); }
    .written { width: 100%; min-height: 150px; border: 2px solid #cfdbdf; border-radius: 16px; padding: 14px 16px; font-family: var(--reading-font); font-weight: 700; font-size: var(--reading-size); line-height: 1.35; color: var(--ink); background: #fff; resize: vertical; text-transform: var(--reading-case); }
    .pad { background: #fff; border: 2px solid #cfdbdf; border-radius: 16px; overflow: hidden; touch-action: none; }
    .pad canvas { display: block; width: 100%; height: 240px; touch-action: none; cursor: crosshair; }
    .banner { margin-top: 16px; border-radius: 14px; padding: 14px 16px; font-weight: 800; line-height: 1.45; }
    .banner small { display: block; font-weight: 650; color: var(--ink); margin-top: 6px; }
    .banner.good { background: var(--green-pale); color: var(--green); }
    .banner.bad { background: var(--red-pale); color: #8d3b38; }
    .adult-flag { display: inline-block; background: #f3eee4; color: #6d5b3b; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; }
    .adult-card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
    .adult-card strong { display: block; font-size: 18px; line-height: 1.4; margin-bottom: 10px; }
    .child-text { font-size: 22px; font-weight: 700; white-space: pre-wrap; background: #f7f9f6; border-radius: 12px; padding: 12px 14px; margin: 0; }
    .child-draw { width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 12px; display: block; margin-top: 8px; }
    .expect { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
    .judge { display: flex; gap: 10px; margin-top: 12px; }
    .judge-btn { flex: 1; min-height: 52px; border-radius: 14px; font-weight: 800; background: #fff; }
    .judge-btn.good { border: 2px solid #b7d7c4; color: var(--green); }
    .judge-btn.bad { border: 2px solid #e4c4c0; color: var(--red); }
    .judge-btn.good.on { background: var(--green); color: #fff; }
    .judge-btn.bad.on { background: var(--red); color: #fff; }
    .empty { padding: 22px; border: 1px dashed #c9d5da; border-radius: 16px; color: var(--muted); background: #fff; line-height: 1.55; }
    .results-head { text-align: center; }
    .result-icon { width: 82px; height: 82px; margin: 0 auto 15px; background: #ecf6ec; color: #2b764e; border-radius: 50%; display: grid; place-items: center; font-size: 42px; }
    .result-number { font-size: clamp(30px, 5.3vw, 43px); font-weight: 900; margin: 10px 0 5px; }
    .result-comment { color: var(--muted); font-size: 16px; line-height: 1.5; margin-bottom: 8px; }
    .result-list { display: grid; gap: 10px; margin-top: 24px; }
    .result-item { display: flex; gap: 13px; align-items: flex-start; border-radius: 13px; border: 1px solid var(--line); padding: 14px 16px; }
    .result-item.good { background: var(--green-pale); border-color: #d0e7d8; }
    .result-item.bad { background: var(--red-pale); border-color: #f3d8d3; }
    .status-dot { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; flex: 0 0 28px; font-weight: 900; }
    .good .status-dot { color: var(--green); }
    .bad .status-dot { color: var(--red); }
    .result-item strong { display: block; margin-bottom: 6px; font-size: 15px; line-height: 1.5; }
    .result-item small { font-size: 14px; line-height: 1.55; color: #42505a; }
    .footer { color: #7e8c90; text-align: center; font-size: 12px; padding: 15px 20px 28px; line-height: 1.5; }
    .export-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .sheet-paper {
      background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 28px;
      box-shadow: var(--shadow); color: #22313a;
    }
    .sheet-paper .kicker { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .sheet-paper h1 { font-size: 28px; letter-spacing: -.6px; margin: 8px 0; }
    .sheet-paper .who { color: var(--muted); font-size: 15px; }
    .sheet-paper .who i { display: inline-block; width: 160px; border-bottom: 1px solid #9aa9ac; height: 1.1em; vertical-align: bottom; }
    .sheet-paper .score { font-size: 22px; font-weight: 900; margin: 8px 0; }
    .sheet-paper .story p { display: flex; gap: 12px; border: 1px solid #dee6e9; border-radius: 12px; padding: 12px 14px; background: #fcfdfa; font-size: 20px; font-weight: 700; line-height: 1.4; margin: 0 0 10px; }
    .sheet-paper .story span { color: #9aa9ac; width: 22px; flex: none; }
    .sheet-paper .q { background: #fff; border: 1px solid #dee6e9; border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
    .sheet-paper .q h2 { font-size: 18px; margin: 0 0 10px; }
    .sheet-paper .q.good { background: var(--green-pale); border-color: #d0e7d8; }
    .sheet-paper .q.bad { background: var(--red-pale); border-color: #f3d8d3; }
    .sheet-paper .opt { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; margin: 8px 0; }
    .sheet-paper .box { width: 22px; height: 22px; border: 2px solid #22313a; border-radius: 4px; flex: none; }
    .sheet-paper .lines span { display: block; border-bottom: 1px solid #9aa9ac; height: 34px; }
    .sheet-paper .write-box { height: 140px; border: 2px solid #cfdbdf; border-radius: 12px; background: #fff; }
    .sheet-paper img { max-width: 100%; background: #fff; border: 1px solid #dee6e9; border-radius: 12px; }
    .sheet-paper .foot { color: #7e8c90; font-size: 12px; margin-top: 22px; }
    .export-busy { opacity: .65; pointer-events: none; }
    @media (max-width: 720px) {
      .lesson { min-height: 0; display: grid; grid-template-columns: 66px 1fr; column-gap: 14px; align-items: center; padding: 15px; }
      .lesson-art { grid-row: span 3; margin-bottom: 0; }
      .lesson-score { padding-top: 5px; }
      .story-line { padding: 13px 11px; gap: 8px; }
    }
    @media (max-width: 460px) {
      .wrap { width: min(100% - 24px, 930px); }
      .topbar-inner { min-height: 74px; }
      .brand small { display: none; }
      .brand strong { font-size: 18px; }
      .brand-icon { width: 40px; height: 40px; }
      .panel { border-radius: 18px; }
      .button-row .primary, .button-row .secondary { flex: 1 1 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media print {
      body { background: white; }
      .topbar, .footer, .export-actions, .button-row, .read-tools, .sizes, .type-tools, .text-toggle, .note, .quiz-progress, .answers, .tools, .pad, .judge, .eyebrow, .helper { display: none !important; }
      .wrap { width: 100%; max-width: none; }
      .panel { border: none; box-shadow: none; padding: 0; }
      .sheet-paper { box-shadow: none; border: none; padding: 0; }
      .sheet-paper .q, .sheet-paper .story p { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap topbar-inner">
    <button type="button" class="brand" id="brandHome">
      <span class="brand-icon" aria-hidden="true">Aa</span>
      <span><strong>Hora de Ler</strong><small>Leitura com calma, um dia de cada vez</small></span>
    </button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <button id="backButton" type="button" class="mini-btn" hidden>← Voltar</button>
      <button id="homeButton" type="button" class="mini-btn" hidden>Início</button>
    </div>
  </div></header>
  <main class="wrap" id="app" aria-live="polite"></main>
  <footer class="footer">Feito para ler no tablet. Dá para instalar na tela inicial. Depois da primeira abertura, funciona sem internet. A melhor nota fica neste navegador.</footer>
  <noscript><p class="note wrap">Para usar, abra este arquivo no Chrome ou no Edge, com o JavaScript ligado.</p></noscript>
<script>
(() => {
  'use strict';

  /* ============================================================
     NÍVEIS E ATIVIDADES
     Para colocar uma história nova, copie um bloco dentro de
     activities e cole em seguida. Não precisa mexer no resto.

     level:
       s2   sílabas de no máximo 2 letras
       s3   sílabas de até 3 letras
       sall sílabas de qualquer tamanho
       lh   tarefas com LH
       nh   tarefas com NH
       ch   tarefas com CH
       Para outro som, copie um nível na lista levels (group: 'Sons').

     Perguntas — mode:
       "x"      a criança marca X e o sistema corrige
       "texto"  a criança escreve e um adulto marca certo ou errado
       "caneta" a criança escreve na tela e um adulto corrige

     id tem de ser único.
     line é a linha que prova a resposta. 0 é a primeira linha.
     expect é só para o adulto ver. A criança não vê isso na pergunta.
     ============================================================ */
  const levels = [
    { id: 's2', group: 'Leitura', badge: '2', title: 'Sílabas de até 2 letras', detail: 'Cada sílaba tem no máximo 2 letras. Por exemplo: ba, le, a.' },
    { id: 's3', group: 'Leitura', badge: '3', title: 'Sílabas de até 3 letras', detail: 'Cada sílaba tem até 3 letras. Por exemplo: pra, mar, bo.' },
    { id: 'sall', group: 'Leitura', badge: 'Aa', title: 'Sílabas de todos os tamanhos', detail: 'A sílaba pode ter qualquer tamanho.' },
    { id: 'lh', group: 'Sons', badge: 'LH', title: 'Palavras com LH', detail: 'Textos para treinar o LH, como em palha e folha.' },
    { id: 'nh', group: 'Sons', badge: 'NH', title: 'Palavras com NH', detail: 'Textos para treinar o NH, como em ninho e banho.' },
    { id: 'ch', group: 'Sons', badge: 'CH', title: 'Palavras com CH', detail: 'Textos para treinar o CH, como em chuva e chave.' },
    { id: 'teste', group: 'Adulto', badge: 'Ok', title: 'Testar os três jeitos', detail: 'Serve para ver a correção automática, o texto e a caneta.' }
  ];

  const groupLabels = {
    Leitura: 'Níveis de leitura',
    Sons: 'Sons especiais',
    Adulto: 'Teste do aplicativo'
  };

  const activities = [
    {
      id: 'lia-tico', level: 's2', title: 'Lia e o gato Tico', icon: '🐈',
      lines: ['Lia tem um gato.', 'O gato se chama Tico.', 'Tico gosta de brincar com uma bola.'],
      questions: [
        { mode: 'x', text: 'Quem tem um gato?', options: ['Tico', 'Lia', 'Bola'], correct: 1, line: 0 },
        { mode: 'x', text: 'Como se chama o gato?', options: ['Tico', 'Bola', 'Lia'], correct: 0, line: 1 },
        { mode: 'x', text: 'Com o que Tico gosta de brincar?', options: ['Pipa', 'Carrinho', 'Bola'], correct: 2, line: 2 }
      ]
    },
    {
      id: 'gato', level: 's2', title: 'O gato de Bia', icon: '🐈',
      lines: ['A Bia ama o gato.', 'O gato mia na sala.', 'A Bia dá a bola ao gato.', 'O gato rola a bola.'],
      questions: [
        { mode: 'x', text: 'Quem ama o gato?', options: ['A Bia', 'O sapo', 'A bola'], correct: 0, line: 0 },
        { mode: 'x', text: 'Onde o gato mia?', options: ['Na rua', 'Na sala', 'No lago'], correct: 1, line: 1 },
        { mode: 'x', text: 'O que a Bia dá ao gato?', options: ['A mala', 'A pipa', 'A bola'], correct: 2, line: 2 },
        { mode: 'x', text: 'O que o gato rola?', options: ['A bola', 'A mala', 'A uva'], correct: 0, line: 3 }
      ]
    },
    {
      id: 'pato', level: 's2', title: 'O pato no lago', icon: '🦆',
      lines: ['O pato nada no lago.', 'A Lili vê o pato.', 'A Lili joga a bola.', 'O pato nada até a bola.'],
      questions: [
        { mode: 'x', text: 'Onde o pato nada?', options: ['Na sala', 'No lago', 'Na rua'], correct: 1, line: 0 },
        { mode: 'x', text: 'Quem vê o pato?', options: ['A Lili', 'O gato', 'A Bia'], correct: 0, line: 1 },
        { mode: 'x', text: 'O que a Lili joga?', options: ['A mala', 'A bola', 'A uva'], correct: 1, line: 2 },
        { mode: 'x', text: 'Até onde o pato nada?', options: ['Até a bola', 'Até a casa', 'Até a mala'], correct: 0, line: 3 }
      ]
    },
    {
      id: 'pipa', level: 's2', title: 'A pipa de Lila', icon: '🪁',
      lines: ['A Lila pega a pipa.', 'A pipa é da Lila.', 'A pipa voa na rua.', 'A Lila vê a pipa.'],
      questions: [

  function bindPad() {

  function advance() {

      return;

    grade();
  }
  function grade() {
    navigate(() => {
      const score = scoreOf();

      if (!savedThisRound) {

        const attempts = (prev && prev.attempts ? prev.attempts : 0) + 1;
        let best = score;
        let bestTotal = total;
        if (prev && typeof prev.best === 'number' && prev.total && (prev.best / prev.total) >= (score / total)) {
          best = prev.best;
          bestTotal = prev.total;

  function mountPad(canvas, state, onChange) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = '100%';
    canvas.style.height = '240px';
    const w = Math.max(280, canvas.clientWidth || 280);
    const h = 240;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    let erasing = false;
    let drawing = false;
    let last = null;
    let open = false;
    let undoStack = [];
    let baselineInk = !!state.ink;
    const undoButton = app.querySelector('#toolUndo');

    function applyTool() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = erasing ? '#ffffff' : '#22313a';

    }
    function paintWhite() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      applyTool();
    }
    function show(url, done) {
      const img = new Image();
      img.onload = () => { paintWhite(); ctx.drawImage(img, 0, 0, w, h); applyTool(); if (done) done(); };
      img.onerror = () => { paintWhite(); if (done) done(); };
      img.src = url;
    }
    function refreshUndo() { undoButton.disabled = undoStack.length === 0; }
    if (state.image) show(state.image, () => { open = true; });
    else { paintWhite(); open = true; }
    refreshUndo();

    function point(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('pointerdown', (event) => {
      if (!open) return;
      event.preventDefault();
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      undoStack.push(canvas.toDataURL('image/png'));
      refreshUndo();
      drawing = true;
      last = point(event);
      applyTool();
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(last.x + 0.01, last.y + 0.01);
      ctx.stroke();
      state.ink = true;
      onChange();
    }, { passive: false });
    canvas.addEventListener('pointermove', (event) => {
      if (!drawing) return;
      event.preventDefault();
      const next = point(event);
      applyTool();
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(next.x, next.y);
      ctx.stroke();
      last = next;
    }, { passive: false });
    function endStroke() {
      if (!drawing) return;
      drawing = false;
      state.image = canvas.toDataURL('image/png');
      state.ink = true;
      onChange();
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    function setTool(erase) {
      erasing = erase;
      app.querySelector('#toolPen').classList.toggle('on', !erase);
      app.querySelector('#toolEraser').classList.toggle('on', erase);
    }
    app.querySelector('#toolPen').addEventListener('click', () => setTool(false));
    app.querySelector('#toolEraser').addEventListener('click', () => setTool(true));
    undoButton.addEventListener('click', () => {
      const prev = undoStack.pop();
      refreshUndo();
      if (!prev) return;
      show(prev, () => {
        if (undoStack.length === 0) {
          state.ink = baselineInk;
          state.image = baselineInk ? prev : '';
        } else {
          state.ink = true;
          state.image = canvas.toDataURL('image/png');
        }
        onChange();
      });
    });
    app.querySelector('#toolClear').addEventListener('click', () => {
      undoStack = [];
      baselineInk = false;
      paintWhite();
      state.ink = false;
      state.image = '';
      refreshUndo();
      onChange();
    });
  }

  function renderAdult() {
    const auto = autoCount();
    const cards = current.questions.map((q, i) => ({ q, i })).filter((item) => item.q.mode !== 'x');
    app.innerHTML = `<div class="panel">
      <span class="adult-flag">Adulto</span>
      <h1 class="stage-title">Corrigir as respostas</h1>
      <p class="helper">A criança já respondeu. Marque certo ou errado. ${auto.total ? `O sistema já corrigiu as de marcar X: ${auto.score} de ${auto.total}.` : ''}</p>
      ${cards.map(({ q, i }) => {
        const answer = answers[i];
        const body = q.mode === 'caneta'
          ? (answer.image ? `<img class="child-draw" alt="Resposta escrita à mão" src="${answer.image}">` : '<p class="child-text">Não escreveu.</p>')
          : `<p class="child-text">${escapeText(answer.text || 'Não escreveu.')}</p>`;
        return `<article class="adult-card">
          <strong>${i + 1}. ${escapeText(q.text)}</strong>
          ${body}
          ${q.expect ? `<p class="expect">Resposta esperada: ${escapeText(q.expect)}</p>` : ''}
          <div class="judge">
            <button type="button" class="judge-btn good ${adultMarks[i] === true ? 'on' : ''}" data-q="${i}" data-judge="1">Certo</button>
            <button type="button" class="judge-btn bad ${adultMarks[i] === false ? 'on' : ''}" data-q="${i}" data-judge="0">Errado</button>
          </div>
        </article>`;
      }).join('')}
      <div class="button-row">
        <button type="button" class="secondary" id="backToChild">← Voltar à última pergunta</button>
        <button type="button" class="primary" id="finishAdult" ${adultReady() ? '' : 'disabled'}>Ver o resultado</button>
      </div>
    </div>`;
    app.querySelectorAll('.judge-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const index = Number(button.dataset.q);
        const ok = button.dataset.judge === '1';
        adultMarks[index] = ok;
        if (ok) playCorrect();
        else playWrong();
        const box = button.parentElement;
        box.querySelectorAll('.judge-btn').forEach((item) => item.classList.toggle('on', item === button));
        app.querySelector('#finishAdult').disabled = !adultReady();
      });
    });
    app.querySelector('#backToChild').addEventListener('click', goBack);
    app.querySelector('#finishAdult').addEventListener('click', () => { if (adultReady()) grade(); });
  }

  function resultItems() {
    return current.questions.map((q, i) => {
      let ok = false;
      let media = '';
      let small = '';
      if (q.mode === 'x') {
        ok = answers[i].choice === q.correct;
        const right = Array.isArray(q.options) ? q.options[q.correct] : '';
        small = ok ? 'Acertou.' : `Errou. A resposta é “${escapeText(right || '')}”.`;
        if (typeof q.line === 'number' && current.lines[q.line]) small += ` No texto: “${escapeText(current.lines[q.line])}”.`;
      } else if (q.mode === 'caneta') {
        ok = adultMarks[i] === true;
        if (answers[i].image) media = `<img class="child-draw" alt="Resposta escrita à mão" src="${answers[i].image}">`;
        small = ok ? 'O adulto marcou: certo.' : 'O adulto marcou: errado.';
        if (!ok && q.expect) small += ` Resposta esperada: ${escapeText(q.expect)}.`;
      } else {
        ok = adultMarks[i] === true;
        small = `Escreveu: “${escapeText(answers[i].text || '—')}”. ${ok ? 'O adulto marcou: certo.' : 'O adulto marcou: errado.'}`;
        if (!ok && q.expect) small += ` Resposta esperada: ${escapeText(q.expect)}.`;
      }
      return `<div class="result-item ${ok ? 'good' : 'bad'}"><span class="status-dot" aria-hidden="true">${ok ? '✓' : '×'}</span><div><strong>${i + 1}. ${escapeText(q.text)}</strong>${media}<small>${small}</small></div></div>`;
    }).join('');
  }
  function renderResult() {
    const total = current.questions.length;
    const score = scoreOf();
    const stats = progress[current.id];
    const cheer = score === total ? 'Você leu com muita atenção!' : score * 2 >= total ? 'Muito bem! Vamos ver as respostas.' : 'Boa tentativa! Leia de novo com calma.';
    const auto = autoCount();
    const humanTotal = total - auto.total;
    const breakdown = humanTotal > 0 && auto.total > 0
      ? `<p class="helper">Sistema: ${auto.score} de ${auto.total} · Adulto: ${score - auto.score} de ${humanTotal}</p>` : '';
    app.innerHTML = `<div class="panel">
      <div class="results-head">
        <div class="result-icon" aria-hidden="true">${score === total ? '★' : '✓'}</div>
        <div class="eyebrow">Fim da atividade</div>
        <h1 class="result-number">${score} de ${total} acertos</h1>
        <p class="result-comment">${cheer}</p>
        ${breakdown}
        ${stats ? `<p class="helper">Melhor nota neste navegador: ${stats.best} de ${stats.total}</p>` : ''}
      </div>
      <div class="result-list">${resultItems()}</div>
      <div class="button-row">
        <button type="button" class="primary" id="tryAgain">Ler e fazer de novo</button>
        <button type="button" class="secondary" id="exportDone">Exportar tarefa feita</button>
        <button type="button" class="secondary" id="backLevel">Voltar às histórias</button>
      </div>
    </div>`;
    app.querySelector('#tryAgain').addEventListener('click', () => {
      navigate(() => {
        answers = blankAnswers(current);
        questionIndex = 0;
        viewStory = false;
        savedThisRound = false;
        adultMarks = [];
        stage = 'read';
      });
    });
    app.querySelector('#exportDone').addEventListener('click', () => openExport(true));
    app.querySelector('#backLevel').addEventListener('click', goBack);
  }

  function sheetStamp() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  function sheetWhen() {
    return new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }
  function sheetQuestionBlank(q, i) {
    let space = '';
    if (q.mode === 'x') {
      const options = Array.isArray(q.options) ? q.options : [];
      space = `<div class="opts">${options.map((option) => `<div class="opt"><span class="box"></span><span>${escapeText(option)}</span></div>`).join('')}</div>`;
    } else if (q.mode === 'caneta') {
      space = '<div class="write-box"></div>';
    } else {
      space = '<div class="lines"><span></span><span></span><span></span></div>';
    }
    return `<section class="q"><h2>${i + 1}. ${escapeText(q.text)}</h2>${space}</section>`;
  }
  function sheetQuestionDone(q, i) {
    let ok = false;
    let detail = '';
    let media = '';
    if (q.mode === 'x') {
      ok = answers[i].choice === q.correct;
      const chosen = Array.isArray(q.options) && answers[i].choice != null ? q.options[answers[i].choice] : '';
      const right = Array.isArray(q.options) ? q.options[q.correct] : '';
      detail = `Marcou: ${escapeText(chosen || '—')}. ${ok ? 'Acertou.' : `Errou. A resposta é “${escapeText(right || '')}”.`}`;
      if (typeof q.line === 'number' && current.lines[q.line]) detail += ` No texto: “${escapeText(current.lines[q.line])}”.`;
    } else if (q.mode === 'caneta') {
      ok = adultMarks[i] === true;
      if (answers[i].image) media = `<img alt="Resposta escrita à mão" src="${answers[i].image}">`;
      detail = ok ? 'O adulto marcou: certo.' : 'O adulto marcou: errado.';
      if (!ok && q.expect) detail += ` Resposta esperada: ${escapeText(q.expect)}.`;
    } else {
      ok = adultMarks[i] === true;
      detail = `Escreveu: “${escapeText(answers[i].text || '—')}”. ${ok ? 'O adulto marcou: certo.' : 'O adulto marcou: errado.'}`;
      if (!ok && q.expect) detail += ` Resposta esperada: ${escapeText(q.expect)}.`;
    }
    return `<section class="q ${ok ? 'good' : 'bad'}"><h2>${i + 1}. ${escapeText(q.text)}</h2>${media}<p>${detail}</p></section>`;
  }
  function sheetInnerHtml(done) {
    const level = levelById(current.level);
    const total = current.questions.length;
    const score = done ? scoreOf() : 0;
    const questions = current.questions.map((q, i) => (done ? sheetQuestionDone(q, i) : sheetQuestionBlank(q, i))).join('');
    const lines = current.lines.map((line, i) => `<p><span>${i + 1}</span>${escapeText(line)}</p>`).join('');
    const head = done
      ? `<p class="score">${score} de ${total} acertos</p><p class="who">Nome: <i></i> &nbsp;&nbsp; Data: ${escapeText(sheetWhen())}</p>`
      : '<p class="who">Nome: <i></i> &nbsp;&nbsp; Data: <i></i></p>';
    return `
      <div class="kicker">Hora de Ler${level ? ` · ${escapeText(level.title)}` : ''}</div>
      <h1>${escapeText(current.title)}</h1>
      ${head}
      <div class="story">${lines}</div>
      ${questions}
      <p class="foot">${done ? 'Tarefa feita.' : 'Tarefa em branco, para imprimir ou fazer no papel.'}</p>`;
  }
  function openExport(done) {
    navigate(() => {
      exportDoneFlag = !!done;
      stage = 'export';
    });
  }
  function renderExport() {
    const done = exportDoneFlag;
    app.innerHTML = `<div class="panel">
      <div class="eyebrow">${done ? 'Tarefa feita' : 'Tarefa em branco'}</div>
      <h1 class="stage-title">Prévia para exportar</h1>
      <p class="helper">Veja a folha. Depois escolha imprimir, salvar imagem ou salvar PDF.</p>
      <div class="export-actions">
        <button type="button" class="primary" id="printSheet">Imprimir</button>
        <button type="button" class="secondary" id="imageSheet">Exportar imagem</button>
        <button type="button" class="secondary" id="pdfSheet">Exportar PDF</button>
        <button type="button" class="secondary" id="backExport">← Voltar</button>
      </div>
      <div class="sheet-paper" id="sheetPaper">${sheetInnerHtml(done)}</div>
    </div>`;
    app.querySelector('#printSheet').addEventListener('click', () => window.print());
    app.querySelector('#imageSheet').addEventListener('click', () => exportSheetFile('png'));
    app.querySelector('#pdfSheet').addEventListener('click', () => exportSheetFile('pdf'));
    app.querySelector('#backExport').addEventListener('click', goBack);
  }
  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve(window.html2canvas);
    return new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-h2c]');
      if (existing) {
        existing.addEventListener('load', () => resolve(window.html2canvas));
        existing.addEventListener('error', reject);
        return;
      }
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      script.dataset.h2c = '1';
      script.onload = () => resolve(window.html2canvas);
      script.onerror = () => reject(new Error('Não foi possível carregar a captura.'));
      document.head.appendChild(script);
    });
  }
  async function captureSheetCanvas() {
    const paper = document.getElementById('sheetPaper');
    const html2canvas = await loadHtml2Canvas();
    return html2canvas(paper, {
      backgroundColor: '#ffffff',
      scale: Math.min(2, window.devicePixelRatio || 2),
      useCORS: true,
      logging: false
    });
  }
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function canvasToPdfBlob(canvas) {
    const jpeg = canvas.toDataURL('image/jpeg', 0.92);
    const bin = atob(jpeg.split(',')[1]);
    const imgBytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) imgBytes[i] = bin.charCodeAt(i);
    const pageW = 595.28;
    const pageH = 841.89;
    const margin = 28;
    const maxW = pageW - margin * 2;
    const maxH = pageH - margin * 2;
    const scale = Math.min(maxW / canvas.width, maxH / canvas.height);
    const drawW = canvas.width * scale;
    const drawH = canvas.height * scale;
    const x = (pageW - drawW) / 2;
    const y = pageH - margin - drawH;
    const content = `q ${drawW.toFixed(2)} 0 0 ${drawH.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
    const enc = new TextEncoder();
    const parts = [];
    const offsets = [0];
    let cursor = 0;
    const push = (chunk) => {
      parts.push(chunk);
      cursor += typeof chunk === 'string' ? enc.encode(chunk).length : chunk.length;
    };
    const beginObj = () => { offsets.push(cursor); };
    push('%PDF-1.4\n');
    beginObj();
    push(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
    beginObj();
    push(`2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n`);
    beginObj();
    push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>\nendobj\n`);
    beginObj();
    push(`4 0 obj\n<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream\nendobj\n`);
    beginObj();
    push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`);
    push(imgBytes);
    push(`\nendstream\nendobj\n`);
    const xrefStart = cursor;
    let xref = `xref\n0 6\n0000000000 65535 f \n`;
    for (let i = 1; i <= 5; i += 1) xref += `${String(offsets[i]).padStart(10, '0')} 00000 n \n`;
    push(xref);
    push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
    return new Blob(parts, { type: 'application/pdf' });
  }
  async function exportSheetFile(kind) {
    const panel = app.querySelector('.panel');
    try {
      if (panel) panel.classList.add('export-busy');
      const canvas = await captureSheetCanvas();
      const base = `hora-de-ler-${current.id}-${exportDoneFlag ? 'feita' : 'em-branco'}-${sheetStamp()}`;
      if (kind === 'png') {
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
        downloadBlob(blob, `${base}.png`);
      } else {
        downloadBlob(canvasToPdfBlob(canvas), `${base}.pdf`);
      }
    } catch (err) {
      window.alert('Não deu para gerar o arquivo agora. Confira a internet na primeira vez ou use Imprimir e salve como PDF.');
    } finally {
      if (panel) panel.classList.remove('export-busy');
    }
  }

  function openLevel(id) {
    navigate(() => {
      levelId = id;
      stage = 'level';
      current = null;
    });
  }
  function openActivity(id) {
    const activity = activities.find((item) => item.id === id) || null;
    if (!activity) return;
    navigate(() => {
      current = activity;
      answers = blankAnswers(current);
      questionIndex = 0;
      viewStory = false;
      savedThisRound = false;
      adultMarks = [];
      stage = 'read';
    });
  }
  function goHome(replace) {
    navigate(() => {
      stage = 'home';
      current = null;
      levelId = null;
      questionIndex = 0;
      viewStory = false;
    }, { replace: !!replace });
  }

  document.getElementById('brandHome').addEventListener('click', () => goHome(true));
  homeButton.addEventListener('click', () => goHome(true));
  backButton.addEventListener('click', goBack);
  window.addEventListener('popstate', (event) => {
    restore(event.state);
  });
  applyFont();
  history.replaceState(snapshot(), '');
  render();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
